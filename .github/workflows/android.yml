name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source with native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify native dependencies
        shell: bash
        run: |
          set -euo pipefail

          test -f third_party/proot/src/cli/cli.c
          test -f third_party/proot/src/loader/loader.c
          test -f third_party/libandroid-shmem/shmem.c

          echo "Native PRoot submodules verified."

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
